[project]
name = "JobScouterMCP"
version = "0.1.0"
description = "JobScouterMCP: an MCP server that finds jobs and hackathons for you"
requires-python = ">=3.11"
dependencies = ["mcp>=2.2", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
JobScouterMCP = "JobScouterMCP.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/JobScouterMCP"]